name: Daily Listing Scrape

on:
  schedule:
    - cron: '0 10 * * *'  # 6 AM ET daily
  workflow_dispatch:        # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          WALKSCORE_API_KEY: ${{ secrets.WALKSCORE_API_KEY }}
        run: python scraper/run_sweep.py

      - name: Commit updated data
        run: |
          git config user.name "HomeFinder Bot"
          git config user.email "bot@homefinder.local"
          git add public/data/
          git diff --staged --quiet || git commit -m "data: daily update $(date -u +%Y-%m-%d)"
          git push
